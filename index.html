<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات شبیه ساز زندگی</title>
    <!-- فونت زیبای وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #38bdf8;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* رنگ‌بندی اختصاصی برای هر دکمه */
        .btn-robot { background: linear-gradient(45deg, #2563eb, #3b82f6); }
        .btn-channel { background: linear-gradient(45deg, #0284c7, #0ea5e9); }
        .btn-events { background: linear-gradient(45deg, #059669, #10b981); }
        .btn-group-link { background: linear-gradient(45deg, #7c3aed, #8b5cf6); }
        .btn-creator { background: linear-gradient(45deg, #ea580c, #f97316); }

        .btn span.icon {
            font-size: 1.2rem;
            margin-left: 10px;
        }
        
        .btn span.url {
            font-size: 0.8rem;
            opacity: 0.7;
            direction: ltr;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>به ربات شبیه ساز زندگی خوش آمدید 🌟</h1>

        <div class="btn-group">
            <!-- دکمه ربات -->
            <a href="https://ble.ir/Shabihsaz_zendegi_bot" class="btn btn-robot" target="_blank">
                <span>ورود به ربات</span>
                <span class="url">@Shabihsaz_zendegi_bot</span>
            </a>

            <!-- دکمه کانال اصلی -->
            <a href="https://ble.ir/channel_Shabihsaz_zendegi" class="btn btn-channel" target="_blank">
                <span>کانال اصلی</span>
                <span class="url">@channel_Shabihsaz_zendegi</span>
            </a>

            <!-- دکمه کانال رویداد -->
            <a href="https://ble.ir/Activities_zendegi" class="btn btn-events" target="_blank">
                <span>کانال رویدادها</span>
                <span class="url">@Activities_zendegi</span>
            </a>

            <!-- دکمه گروه -->
            <a href="https://ble.ir/Group_shabihsaz_zendegi" class="btn btn-group-link" target="_blank">
                <span>گروه گفتگو</span>
                <span class="url">@Group_shabihsaz_zendegi</span>
            </a>

            <!-- دکمه سازنده -->
            <a href="https://ble.ir/fazellrahimii" class="btn btn-creator" target="_blank">
                <span>ارتباط با سازنده</span>
                <span class="url">@fazellrahimii</span>
            </a>
        </div>
    </div>

</body>
</html>
